<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Good Morning ♡" />
  <meta name="theme-color" content="#fdf0f3" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Good Morning, Bunny ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blush: #f2c4ce;
      --rose: #e8919f;
      --deep-rose: #c9606f;
      --cream: #fdf0f3;
      --warm-white: #fffaf8;
      --graphite: #5a4a4e;
      --soft-graphite: #8a7a7e;
      --gold: #d4a96a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--graphite);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 40px 24px 20px;
      position: relative;
    }

    .header-petal {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--blush), var(--rose), var(--blush));
    }

    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 300;
      color: var(--deep-rose);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .greeting em {
      font-style: italic;
      font-weight: 400;
    }

    .date-display {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft-graphite);
    }

    .heart-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 16px auto;
    }
    .heart-divider::before,
    .heart-divider::after {
      content: '';
      height: 1px;
      width: 60px;
      background: var(--blush);
    }
    .heart-divider span { color: var(--rose); font-size: 0.85rem; }

    /* ── CARD CAROUSEL ── */
    .card-section {
      padding: 0 0 32px;
    }

    .section-label {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--soft-graphite);
      margin-bottom: 16px;
    }

    .carousel-wrapper {
      position: relative;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 16px;
      padding: 8px 24px 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 calc(100vw - 64px);
      max-width: 360px;
      scroll-snap-align: center;
      background: var(--warm-white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(200, 100, 110, 0.12);
      position: relative;
      animation: cardIn 0.5s ease both;
    }
    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }
    .card:nth-child(4) { animation-delay: 0.24s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--blush);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--deep-rose);
      z-index: 2;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .card-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--rose);
      font-size: 2rem;
    }
    .card-placeholder p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      color: var(--soft-graphite);
      letter-spacing: 0.05em;
    }

    /* tap hint on cards */
    .card img { cursor: zoom-in; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: lbIn 0.2s ease;
    }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

    .lightbox img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
      animation: lbScale 0.25s cubic-bezier(0.34,1.26,0.64,1);
    }
    @keyframes lbScale { from { transform: scale(0.88); } to { transform: scale(1); } }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); }

    .lightbox-label {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 16px;
      color: white;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* dot indicators */
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blush);
      transition: all 0.3s;
      cursor: pointer;
    }
    .dot.active {
      background: var(--rose);
      width: 18px;
      border-radius: 3px;
    }

    /* ── LOADING / EMPTY ── */
    .loading-state {
      text-align: center;
      padding: 60px 24px;
    }
    .loading-state .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--blush);
      border-top-color: var(--rose);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--deep-rose);
      margin-bottom: 6px;
    }
    .empty-state p {
      font-size: 0.85rem;
      color: var(--soft-graphite);
      line-height: 1.6;
    }

    /* ── SUBSCRIBE BUTTON ── */
    .notify-bar {
      margin: 0 24px 32px;
      background: linear-gradient(135deg, #fff0f3, #fde8ed);
      border: 1px solid var(--blush);
      border-radius: 16px;
      padding: 18px 20px;
      text-align: center;
    }
    .notify-bar p {
      font-size: 0.82rem;
      color: var(--soft-graphite);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .notify-bar strong {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--graphite);
      display: block;
      margin-bottom: 4px;
    }

    .btn-notify {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--rose);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 0.82rem;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-notify:hover { background: var(--deep-rose); }
    .btn-notify:active { transform: scale(0.97); }

    .notify-granted {
      font-size: 0.82rem;
      color: #7a9e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ── LIBRARY ── */
    .library-section {
      padding: 0 24px 48px;
    }

    .library-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .library-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--graphite);
    }

    .library-count {
      font-size: 0.72rem;
      color: var(--soft-graphite);
      letter-spacing: 0.1em;
    }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .library-entry {
      background: var(--warm-white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(200,100,110,0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .library-entry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,100,110,0.15); }
    .library-entry:active { transform: scale(0.98); }

    .library-thumb {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
    }

    .library-thumb-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .library-date {
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--soft-graphite);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ── MODAL (past day viewer) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 74, 78, 0.5);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-sheet {
      background: var(--cream);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 12px 0 40px;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.26, 0.64, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-handle {
      width: 40px; height: 4px;
      background: var(--blush);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .modal-date {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: var(--deep-rose);
      margin-bottom: 4px;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 20px;
      background: none; border: none;
      font-size: 1.4rem;
      color: var(--soft-graphite);
      cursor: pointer;
      padding: 4px;
      z-index: 10;
    }
    .modal-sheet { position: relative; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 16px 24px 40px;
      font-size: 0.72rem;
      color: var(--blush);
      letter-spacing: 0.08em;
    }
    footer span { color: var(--rose); }
  </style>
</head>
<body>

<header>
  <div class="header-petal"></div>
  <div class="greeting">Good morning,<br><em>Bunny</em> ♡</div>
  <div class="date-display" id="dateDisplay">—</div>
  <div class="heart-divider"><span>♡</span></div>
</header>

<!-- Notification bar -->
<div class="notify-bar" id="notifyBar" style="display:none">
  <strong>Get your morning message at 8am</strong>
  <p>Allow notifications so your daily affirmations arrive right on time.</p>
  <button class="btn-notify" onclick="requestNotification()">🔔 Turn on morning messages</button>
</div>

<!-- Today's cards -->
<div class="card-section">
  <div class="section-label">Today's Affirmations</div>
  <div class="carousel-wrapper">
    <div class="carousel" id="todayCarousel">
      <div class="loading-state" style="flex: 0 0 100%; text-align:center; padding: 60px 0;">
        <div class="spinner"></div>
        <p style="font-size:0.85rem; color: var(--soft-graphite);">Loading today's messages…</p>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<!-- Library -->
<div class="library-section">
  <div class="library-header">
    <div class="library-title">Past Messages</div>
    <div class="library-count" id="libraryCount"></div>
  </div>
  <div class="library-grid" id="libraryGrid">
    <!-- populated by JS -->
  </div>
</div>

<footer>Made with <span>♡</span> every single morning</footer>

<!-- Lightbox for full-screen image view -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<!-- Modal for past days -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-date" id="modalDate"></div>
    <div class="heart-divider" style="margin: 8px 0 16px;"><span>♡</span></div>
    <div class="carousel" id="modalCarousel"></div>
    <div class="dots" id="modalDots" style="margin-top:4px;"></div>
  </div>
</div>

<script>
  // ── CONFIG ── replace these with your Supabase project values
  const SUPABASE_URL = 'https://istzagkjchlvjsbrvahm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHphZ2tqY2hsdmpzYnJ2YWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTk4MzgsImV4cCI6MjA5NTg3NTgzOH0.7JeL2ScsjC1hoySuKb6q2omgFkGnGoL8dOPDNRNDezk';

  // ── DATE HELPERS ──
  function todayKey() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-CA', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }

  function formatDateShort(iso) {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-CA', { month:'short', day:'numeric' });
  }

  // ── SUPABASE FETCH ──
  async function fetchDay(dateKey) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/affirmations?date=eq.${dateKey}&select=*`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    return rows[0] || null;
  }

  async function fetchLibrary() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/affirmations?select=date,image_1&order=date.desc&limit=50`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    return await res.json();
  }

  // ── LIGHTBOX ──
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox') &&
        e.target !== document.querySelector('.lightbox-close')) return;
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }

  // close on Escape key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = '';
    }
  });

  // ── RENDER CARDS ──
  function buildCards(entry, carouselEl, dotsEl) {
    carouselEl.innerHTML = '';
    dotsEl.innerHTML = '';

    const images = [entry.image_1, entry.image_2, entry.image_3, entry.image_4];
    images.forEach((url, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.08) + 's';

      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = CARD_LABELS[i];
        img.loading = 'lazy';
        img.onclick = () => openLightbox(url);
        card.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'card-placeholder';
        ph.innerHTML = '<span>♡</span><p>Coming soon</p>';
        card.appendChild(ph);
      }
      carouselEl.appendChild(card);

      // dot
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => {
        carouselEl.children[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      };
      dotsEl.appendChild(dot);
    });

    // update dots on scroll
    carouselEl.addEventListener('scroll', () => {
      const idx = Math.round(carouselEl.scrollLeft / carouselEl.offsetWidth);
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === idx));
    }, { passive: true });
  }

  // ── LOAD TODAY ──
  async function loadToday() {
    const key = todayKey();
    document.getElementById('dateDisplay').textContent = formatDate(key).toUpperCase();

    const entry = await fetchDay(key);
    const carousel = document.getElementById('todayCarousel');
    const dots = document.getElementById('dots');

    if (!entry) {
      carousel.innerHTML = `
        <div class="empty-state" style="flex:0 0 100%;">
          <div class="icon">🌸</div>
          <h3>Not here yet…</h3>
          <p>Today's messages are on their way.<br>Check back a little later, love.</p>
        </div>`;
      return;
    }
    buildCards(entry, carousel, dots);
  }

  // ── LOAD LIBRARY ──
  async function loadLibrary() {
    const entries = await fetchLibrary();
    const grid = document.getElementById('libraryGrid');
    const today = todayKey();
    const past = entries.filter(e => e.date !== today);

    document.getElementById('libraryCount').textContent = past.length > 0 ? `${past.length} days` : '';

    if (past.length === 0) {
      grid.innerHTML = `<p style="grid-column:span 2; color:var(--soft-graphite); font-size:0.82rem; text-align:center; padding:20px 0;">Your library will grow here every day ♡</p>`;
      return;
    }

    past.forEach(e => {
      const card = document.createElement('div');
      card.className = 'library-entry';
      card.onclick = () => openModal(e.date);
      if (e.image_1) {
        card.innerHTML = `<img class="library-thumb" src="${e.image_1}" alt="${e.date}" loading="lazy" />
          <div class="library-date">${formatDateShort(e.date)}</div>`;
      } else {
        card.innerHTML = `<div class="library-thumb-placeholder">♡</div>
          <div class="library-date">${formatDateShort(e.date)}</div>`;
      }
      grid.appendChild(card);
    });
  }

  // ── MODAL ──
  async function openModal(dateKey) {
    const entry = await fetchDay(dateKey);
    if (!entry) return;
    document.getElementById('modalDate').textContent = formatDate(dateKey);
    const carousel = document.getElementById('modalCarousel');
    const dots = document.getElementById('modalDots');
    buildCards(entry, carousel, dots);
    document.getElementById('modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modal') && e.type === 'click') return;
    document.getElementById('modal').style.display = 'none';
    document.body.style.overflow = '';
  }

  // ── NOTIFICATIONS ──
  function checkNotificationStatus() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    if (Notification.permission === 'default') {
      document.getElementById('notifyBar').style.display = 'block';
    } else if (Notification.permission === 'granted') {
      document.getElementById('notifyBar').innerHTML =
        `<div class="notify-granted">✓ &nbsp;Morning messages are on</div>`;
      document.getElementById('notifyBar').style.display = 'block';
      registerServiceWorker();
    }
  }

  async function requestNotification() {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      document.getElementById('notifyBar').innerHTML =
        `<div class="notify-granted">✓ &nbsp;You'll hear from us at 8am ♡</div>`;
      registerServiceWorker();
    } else {
      document.getElementById('notifyBar').style.display = 'none';
    }
  }

  async function registerServiceWorker() {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array('BL6-lDWuoO0jKwTcJPQcGFJbzhpWP3IJ1rP_Aj_f6skOloeESzd_2PMeojf_IAgXJOyIeduW4Bbu1TEmx1If1C4')
      });
      // Save subscription to Supabase
      await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ subscription: sub })
      });
    } catch (err) { console.warn('SW registration failed:', err); }
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = window.atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // ── INIT ──
  loadToday();
  loadLibrary();
  checkNotificationStatus();
</script>
