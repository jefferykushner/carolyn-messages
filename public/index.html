<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Good Morning ♡" />
  <meta name="theme-color" content="#fdf0f3" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Good Morning ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blush: #f2c4ce;
      --rose: #e8919f;
      --deep-rose: #c9606f;
      --cream: #fdf0f3;
      --warm-white: #fffaf8;
      --graphite: #5a4a4e;
      --soft-graphite: #8a7a7e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--graphite);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 40px 24px 20px;
      position: relative;
    }

    .header-petal {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--blush), var(--rose), var(--blush));
    }

    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 300;
      color: var(--deep-rose);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .greeting em {
      font-style: italic;
      font-weight: 400;
    }

    .date-display {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft-graphite);
    }

    .heart-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 16px auto;
    }
    .heart-divider::before,
    .heart-divider::after {
      content: '';
      height: 1px;
      width: 60px;
      background: var(--blush);
    }
    .heart-divider span { color: var(--rose); font-size: 0.85rem; }

    /* ── CARD CAROUSEL ── */
    .card-section { padding: 0 0 32px; }

    .section-label {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--soft-graphite);
      margin-bottom: 16px;
    }

    .carousel-wrapper { position: relative; overflow: hidden; }

    .carousel {
      display: flex;
      gap: 16px;
      padding: 8px 24px 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 calc(100vw - 64px);
      max-width: 360px;
      scroll-snap-align: center;
      background: var(--warm-white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(200, 100, 110, 0.12);
      position: relative;
      animation: cardIn 0.5s ease both;
      display: flex;
      flex-direction: column;
    }
    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }
    .card:nth-child(4) { animation-delay: 0.24s; }
    .card:nth-child(5) { animation-delay: 0.32s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card img.card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .card-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--rose);
      font-size: 2rem;
    }
    .card-placeholder p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      color: var(--soft-graphite);
      letter-spacing: 0.05em;
    }

    /* text beneath card image */
    .card-message {
      padding: 16px 18px 18px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      font-style: italic;
      color: var(--graphite);
      line-height: 1.65;
      text-align: center;
      border-top: 1px solid var(--blush);
    }

    /* ── LOVE NOTE CARD (first in deck) ── */
    .note-card-body {
      display: flex;
      flex-direction: column;
      /* Hard square: height locked to the card's width */
      height: min(calc(100vw - 64px), 360px);
      padding: 20px 22px 14px;
      background:
        linear-gradient(160deg, #fffdf6 0%, #fdf4ec 100%);
      overflow: hidden;
    }

    .note-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    /* margin:auto centers short notes without the clipped-top
       overflow bug that flex centering causes in scroll containers */
    .note-scroll .note-text { margin: auto 0; }

    .note-eyebrow {
      font-size: 0.64rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--rose);
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .note-text {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      font-weight: 400;
      color: #4a3c30;
      line-height: 1.55;
      text-align: center;
      white-space: pre-wrap;
    }
    .note-text.long { font-size: 1.2rem; line-height: 1.5; }
    .note-text.very-long { font-size: 1rem; line-height: 1.45; }
    .note-text.extra-long { font-size: 0.88rem; line-height: 1.42; }

    .note-sig {
      font-family: 'Caveat', cursive;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--deep-rose);
      text-align: right;
      flex-shrink: 0;
      margin-top: 8px;
    }

    /* ── CARD FOOTER (play + heart) ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-top: 1px solid var(--blush);
      margin-top: auto;
    }

    .play-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 50%;
      transition: transform 0.2s;
      color: var(--rose);
      line-height: 1;
    }
    .play-btn:active { transform: scale(1.2); }
    .play-btn.playing { color: var(--deep-rose); }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 50%;
      transition: transform 0.2s;
      color: var(--blush);
    }
    .fav-btn:active { transform: scale(1.3); }
    .fav-btn.active { color: var(--deep-rose); }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: lbIn 0.2s ease;
    }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

    .lightbox img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
      animation: lbScale 0.25s cubic-bezier(0.34,1.26,0.64,1);
    }
    @keyframes lbScale { from { transform: scale(0.88); } to { transform: scale(1); } }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); }

    /* dot indicators */
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blush);
      transition: all 0.3s;
      cursor: pointer;
    }
    .dot.active {
      background: var(--rose);
      width: 18px;
      border-radius: 3px;
    }

    /* ── LOADING / EMPTY ── */
    .loading-state { text-align: center; padding: 60px 24px; }
    .loading-state .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--blush);
      border-top-color: var(--rose);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 60px 24px; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--deep-rose);
      margin-bottom: 6px;
    }
    .empty-state p {
      font-size: 0.85rem;
      color: var(--soft-graphite);
      line-height: 1.6;
    }

    /* ── SUBSCRIBE BAR ── */
    .notify-bar {
      margin: 0 24px 28px;
      background: linear-gradient(135deg, #fff0f3, #fde8ed);
      border: 1px solid var(--blush);
      border-radius: 16px;
      padding: 18px 20px;
      text-align: center;
    }
    .notify-bar p {
      font-size: 0.82rem;
      color: var(--soft-graphite);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .notify-bar strong {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--graphite);
      display: block;
      margin-bottom: 4px;
    }

    .btn-notify {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--rose);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 0.82rem;
      font-family: 'Lato', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-notify:hover { background: var(--deep-rose); }
    .btn-notify:active { transform: scale(0.97); }

    .notify-granted {
      font-size: 0.82rem;
      color: #7a9e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ── LIBRARY ── */
    .library-section { padding: 0 24px 48px; }

    .library-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .library-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--graphite);
    }

    .library-count {
      font-size: 0.72rem;
      color: var(--soft-graphite);
      letter-spacing: 0.1em;
    }

    .library-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      background: var(--warm-white);
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 1px 8px rgba(200,100,110,0.07);
    }

    .lib-tab {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 9px;
      background: none;
      font-family: 'Lato', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soft-graphite);
      cursor: pointer;
      transition: all 0.2s;
    }
    .lib-tab.active { background: var(--rose); color: white; }

    .fav-empty {
      grid-column: span 2;
      text-align: center;
      padding: 32px 16px;
      color: var(--soft-graphite);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .fav-empty .icon { font-size: 2rem; margin-bottom: 8px; }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .library-entry {
      background: var(--warm-white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(200,100,110,0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .library-entry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,100,110,0.15); }
    .library-entry:active { transform: scale(0.98); }

    .library-thumb {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
    }

    .library-thumb-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, #fde8ed, #fdf0f3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .library-date {
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--soft-graphite);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ── MODAL (past day viewer) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 74, 78, 0.5);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-sheet {
      background: var(--cream);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 12px 0 40px;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.26, 0.64, 1);
      position: relative;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-handle {
      width: 40px; height: 4px;
      background: var(--blush);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .modal-date {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: var(--deep-rose);
      margin-bottom: 4px;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 20px;
      background: none; border: none;
      font-size: 1.4rem;
      color: var(--soft-graphite);
      cursor: pointer;
      padding: 4px;
      z-index: 10;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 16px 24px 40px;
      font-size: 0.72rem;
      color: var(--blush);
      letter-spacing: 0.08em;
    }
    footer span { color: var(--rose); }
  </style>
</head>
<body>

<header>
  <div class="header-petal"></div>
  <div class="greeting">Good morning,<br><em id="nickname">love</em> ♡</div>
  <div class="date-display" id="dateDisplay">—</div>
  <div class="heart-divider"><span>♡</span></div>
</header>

<!-- Notification bar -->
<div class="notify-bar" id="notifyBar" style="display:none">
  <strong>Get your morning message at 8am</strong>
  <p>Allow notifications so your daily affirmations arrive right on time.</p>
  <button class="btn-notify" onclick="requestNotification()">🔔 Turn on morning messages</button>
</div>

<!-- Today's cards -->
<div class="card-section">
  <div class="section-label">Today's Messages</div>
  <div class="carousel-wrapper">
    <div class="carousel" id="todayCarousel">
      <div class="loading-state" style="flex: 0 0 100%; text-align:center; padding: 60px 0;">
        <div class="spinner"></div>
        <p style="font-size:0.85rem; color: var(--soft-graphite);">Loading today's messages…</p>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<!-- Library -->
<div class="library-section">
  <div class="library-header">
    <div class="library-title">Messages</div>
    <div class="library-count" id="libraryCount"></div>
  </div>
  <div class="library-tabs">
    <button class="lib-tab active" id="tabAll" onclick="switchTab('all')">All Days</button>
    <button class="lib-tab" id="tabFavs" onclick="switchTab('favs')">♥ Favourites</button>
  </div>
  <div class="library-grid" id="libraryGrid"></div>
</div>

<footer>Made with <span>♡</span> every single morning</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<!-- Modal for past days -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-date" id="modalDate"></div>
    <div class="heart-divider" style="margin: 8px 0 16px;"><span>♡</span></div>
    <div class="carousel" id="modalCarousel"></div>
    <div class="dots" id="modalDots" style="margin-top:4px;"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://istzagkjchlvjsbrvahm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHphZ2tqY2hsdmpzYnJ2YWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTk4MzgsImV4cCI6MjA5NTg3NTgzOH0.7JeL2ScsjC1hoySuKb6q2omgFkGnGoL8dOPDNRNDezk';

  // ── NICKNAME ROTATION ──
  const NICKNAMES = ['Angel', 'Sweetheart', 'Sweets', 'Bun-Bun', 'Love'];

  function nicknameForToday() {
    // Seeded by date so it stays stable all day but changes day to day
    const key = todayKey();
    let hash = 0;
    for (let i = 0; i < key.length; i++) {
      hash = ((hash * 31) + key.charCodeAt(i)) >>> 0;
    }
    return NICKNAMES[hash % NICKNAMES.length];
  }

  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-CA', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }

  function formatDateShort(iso) {
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-CA', { month:'short', day:'numeric' });
  }

  async function fetchDay(dateKey) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/affirmations?date=eq.${dateKey}&select=*`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    return rows[0] || null;
  }

  async function fetchLibrary() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/affirmations?select=date,image_1&order=date.desc&limit=100`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    return await res.json();
  }

  // ── LIGHTBOX ──
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox') &&
        !e.target.classList.contains('lightbox-close')) return;
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = '';
    }
  });

  // ── FAVOURITES (localStorage) ──
  function getFavs() {
    try { return JSON.parse(localStorage.getItem('carolyn_favs') || '{}'); }
    catch { return {}; }
  }

  function saveFavs(favs) {
    localStorage.setItem('carolyn_favs', JSON.stringify(favs));
  }

  function isFav(dateKey, idx) {
    const favs = getFavs();
    return !!(favs[dateKey] && favs[dateKey].includes(idx));
  }

  function toggleFav(dateKey, idx, btn) {
    const favs = getFavs();
    if (!favs[dateKey]) favs[dateKey] = [];
    const pos = favs[dateKey].indexOf(idx);
    if (pos === -1) {
      favs[dateKey].push(idx);
      btn.textContent = '♥';
      btn.classList.add('active');
      btn.style.transform = 'scale(1.4)';
      setTimeout(() => btn.style.transform = '', 250);
    } else {
      favs[dateKey].splice(pos, 1);
      if (favs[dateKey].length === 0) delete favs[dateKey];
      btn.textContent = '♡';
      btn.classList.remove('active');
    }
    saveFavs(favs);
    if (currentTab === 'favs') renderLibrary();
  }

  // ── AUDIO PLAY HELPER ──
  function makePlayButton(audioUrl) {
    const audio = new Audio(audioUrl);
    const playBtn = document.createElement('button');
    playBtn.className = 'play-btn';
    playBtn.title = 'Play voice note';
    playBtn.textContent = '▶';
    playBtn.onclick = (e) => {
      e.stopPropagation();
      if (audio.paused) {
        activeAudios.forEach(a => a.pause());
        document.querySelectorAll('.play-btn').forEach(b => { b.textContent = '▶'; b.classList.remove('playing'); });
        audio.play();
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        audio.onended = () => { playBtn.textContent = '▶'; playBtn.classList.remove('playing'); };
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
      }
    };
    activeAudios.push(audio);
    return playBtn;
  }

  let activeAudios = [];

  function stopAllAudio() {
    activeAudios.forEach(a => a.pause());
    document.querySelectorAll('.play-btn').forEach(b => { b.textContent = '▶'; b.classList.remove('playing'); });
  }

  // ── CARD FOOTER BUILDER ──
  function makeFooter(entry, favIdx, audioUrl) {
    const footer = document.createElement('div');
    footer.className = 'card-footer';

    if (audioUrl) {
      footer.appendChild(makePlayButton(audioUrl));
    } else {
      footer.appendChild(document.createElement('span'));
    }

    const favBtn = document.createElement('button');
    const alreadyFav = isFav(entry.date, favIdx);
    favBtn.className = 'fav-btn' + (alreadyFav ? ' active' : '');
    favBtn.textContent = alreadyFav ? '♥' : '♡';
    favBtn.title = 'Save to favourites';
    favBtn.onclick = (e) => {
      e.stopPropagation();
      toggleFav(entry.date, favIdx, favBtn);
    };
    footer.appendChild(favBtn);
    return footer;
  }

  // ── RENDER CARDS (love note first, then images) ──
  function buildCards(entry, carouselEl, dotsEl) {
    carouselEl.innerHTML = '';
    dotsEl.innerHTML = '';

    const cards = [];

    // Love note card first (if present)
    if ((entry.love_note && entry.love_note.trim()) || entry.audio_love_note) {
      const card = document.createElement('div');
      card.className = 'card';

      const body = document.createElement('div');
      body.className = 'note-card-body';

      const eyebrow = document.createElement('div');
      eyebrow.className = 'note-eyebrow';
      eyebrow.textContent = 'A note from Jeff ♡';
      body.appendChild(eyebrow);

      const textWrap = document.createElement('div');
      textWrap.className = 'note-scroll';

      if (entry.love_note && entry.love_note.trim()) {
        const noteStr = entry.love_note.trim();
        const text = document.createElement('div');
        text.className = 'note-text';
        if (noteStr.length > 600) text.classList.add('extra-long');
        else if (noteStr.length > 340) text.classList.add('very-long');
        else if (noteStr.length > 180) text.classList.add('long');
        text.textContent = noteStr;
        textWrap.appendChild(text);
      }
      body.appendChild(textWrap);

      const sig = document.createElement('div');
      sig.className = 'note-sig';
      sig.textContent = '— Jeff';
      body.appendChild(sig);

      card.appendChild(body);
      card.appendChild(makeFooter(entry, 4, entry.audio_love_note));
      cards.push(card);
    }

    // Image cards
    const images = [entry.image_1, entry.image_2, entry.image_3, entry.image_4];
    const texts  = [entry.text_1,  entry.text_2,  entry.text_3,  entry.text_4];
    const audios = [entry.audio_1, entry.audio_2, entry.audio_3, entry.audio_4];

    images.forEach((url, i) => {
      // Skip completely empty slots
      if (!url && !texts[i] && !audios[i]) return;

      const card = document.createElement('div');
      card.className = 'card';

      if (url) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = url;
        img.alt = 'Affirmation';
        img.loading = 'lazy';
        img.onclick = () => openLightbox(url);
        card.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'card-placeholder';
        ph.innerHTML = '<span>♡</span><p>Coming soon</p>';
        card.appendChild(ph);
      }

      if (texts[i] && texts[i].trim()) {
        const msg = document.createElement('div');
        msg.className = 'card-message';
        msg.textContent = texts[i].trim();
        card.appendChild(msg);
      }

      card.appendChild(makeFooter(entry, i, audios[i]));
      cards.push(card);
    });

    // Attach cards with stagger + dots
    cards.forEach((card, i) => {
      card.style.animationDelay = (i * 0.08) + 's';
      carouselEl.appendChild(card);

      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => {
        carouselEl.children[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      };
      dotsEl.appendChild(dot);
    });

    carouselEl.addEventListener('scroll', () => {
      const idx = Math.round(carouselEl.scrollLeft / carouselEl.offsetWidth);
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === idx));
    }, { passive: true });
  }

  // ── LOAD TODAY ──
  async function loadToday() {
    const key = todayKey();
    document.getElementById('dateDisplay').textContent = formatDate(key).toUpperCase();
    document.getElementById('nickname').textContent = nicknameForToday();

    const entry = await fetchDay(key);
    const carousel = document.getElementById('todayCarousel');
    const dots = document.getElementById('dots');

    if (!entry) {
      carousel.innerHTML = `
        <div class="empty-state" style="flex:0 0 100%;">
          <div class="icon">🌸</div>
          <h3>Not here yet…</h3>
          <p>Today's messages are on their way.<br>Check back a little later, love.</p>
        </div>`;
      return;
    }
    buildCards(entry, carousel, dots);
  }

  // ── LIBRARY ──
  let allEntries = [];
  let currentTab = 'all';

  async function loadLibrary() {
    allEntries = await fetchLibrary();
    renderLibrary();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabAll').classList.toggle('active', tab === 'all');
    document.getElementById('tabFavs').classList.toggle('active', tab === 'favs');
    renderLibrary();
  }

  function renderLibrary() {
    const grid = document.getElementById('libraryGrid');
    const today = todayKey();
    const past = allEntries.filter(e => e.date !== today);

    if (currentTab === 'favs') {
      const favs = getFavs();
      const favDates = Object.keys(favs);
      const favEntries = past.filter(e => favDates.includes(e.date));

      if (favEntries.length === 0) {
        grid.innerHTML = `<div class="fav-empty"><div class="icon">♡</div><p>Tap the ♡ on any card<br>to save your favourites here.</p></div>`;
        document.getElementById('libraryCount').textContent = '';
        return;
      }
      document.getElementById('libraryCount').textContent = `${favEntries.length} saved`;
      renderGrid(grid, favEntries);
    } else {
      document.getElementById('libraryCount').textContent = past.length > 0 ? `${past.length} days` : '';
      if (past.length === 0) {
        grid.innerHTML = `<p style="grid-column:span 2; color:var(--soft-graphite); font-size:0.82rem; text-align:center; padding:20px 0;">Your library will grow here every day ♡</p>`;
        return;
      }
      renderGrid(grid, past);
    }
  }

  function renderGrid(grid, entries) {
    grid.innerHTML = '';
    entries.forEach(e => {
      const card = document.createElement('div');
      card.className = 'library-entry';
      card.onclick = () => openModal(e.date);
      if (e.image_1) {
        card.innerHTML = `<img class="library-thumb" src="${e.image_1}" alt="${e.date}" loading="lazy" />
          <div class="library-date">${formatDateShort(e.date)}</div>`;
      } else {
        card.innerHTML = `<div class="library-thumb-placeholder">♡</div>
          <div class="library-date">${formatDateShort(e.date)}</div>`;
      }
      grid.appendChild(card);
    });
  }

  // ── MODAL ──
  async function openModal(dateKey) {
    const entry = await fetchDay(dateKey);
    if (!entry) return;
    document.getElementById('modalDate').textContent = formatDate(dateKey);
    const carousel = document.getElementById('modalCarousel');
    const dots = document.getElementById('modalDots');
    buildCards(entry, carousel, dots);
    document.getElementById('modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modal') && e.type === 'click') return;
    stopAllAudio();
    document.getElementById('modal').style.display = 'none';
    document.body.style.overflow = '';
  }

  // ── NOTIFICATIONS ──
  function checkNotificationStatus() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    if (Notification.permission === 'default') {
      document.getElementById('notifyBar').style.display = 'block';
    } else if (Notification.permission === 'granted') {
      document.getElementById('notifyBar').innerHTML =
        `<div class="notify-granted">✓ &nbsp;Morning messages are on</div>`;
      document.getElementById('notifyBar').style.display = 'block';
      registerServiceWorker();
    }
  }

  async function requestNotification() {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      document.getElementById('notifyBar').innerHTML =
        `<div class="notify-granted">✓ &nbsp;You'll hear from us at 8am ♡</div>`;
      registerServiceWorker();
    } else {
      document.getElementById('notifyBar').style.display = 'none';
    }
  }

  async function registerServiceWorker() {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array('BL6-lDWuoO0jKwTcJPQcGFJbzhpWP3IJ1rP_Aj_f6skOloeESzd_2PMeojf_IAgXJOyIeduW4Bbu1TEmx1If1C4')
      });
      await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ subscription: sub })
      });
    } catch (err) { console.warn('SW registration failed:', err); }
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = window.atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  loadToday();
  loadLibrary();
  checkNotificationStatus();
</script>
