<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Morning Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blush: #f2c4ce;
      --rose: #e8919f;
      --deep-rose: #c9606f;
      --cream: #fdf0f3;
      --warm-white: #fffaf8;
      --graphite: #5a4a4e;
      --soft-graphite: #8a7a7e;
      --success: #7a9e7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #f5f0f1;
      color: var(--graphite);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .container { max-width: 680px; margin: 0 auto; }

    header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--blush);
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
      color: var(--deep-rose);
    }

    header p {
      font-size: 0.85rem;
      color: var(--soft-graphite);
      margin-top: 4px;
    }

    /* DATE PICKER */
    .field-group {
      background: var(--warm-white);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(200,100,110,0.07);
    }

    .field-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft-graphite);
      margin-bottom: 10px;
    }

    input[type="date"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--blush);
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      color: var(--graphite);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="date"]:focus { border-color: var(--rose); }

    /* IMAGE UPLOAD SLOTS */
    .uploads-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .uploads-grid { grid-template-columns: 1fr; }
    }

    .upload-slot {
      background: var(--warm-white);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(200,100,110,0.07);
    }

    .upload-slot .slot-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--deep-rose);
      margin-bottom: 4px;
    }

    .upload-slot .slot-desc {
      font-size: 0.78rem;
      color: var(--soft-graphite);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .drop-zone {
      border: 2px dashed var(--blush);
      border-radius: 12px;
      aspect-ratio: 1/1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
      position: relative;
      background: var(--cream);
    }
    .drop-zone:hover { border-color: var(--rose); background: #fde8ed; }
    .drop-zone.has-image { border-style: solid; border-color: var(--rose); }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .drop-zone img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .drop-zone .drop-hint {
      text-align: center;
      color: var(--soft-graphite);
      z-index: 0;
    }
    .drop-zone .drop-hint .icon { font-size: 1.8rem; margin-bottom: 6px; }
    .drop-zone .drop-hint p { font-size: 0.75rem; line-height: 1.4; }

    .drop-zone .clear-btn {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 3;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--rose);
      border-radius: 50%;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--deep-rose);
      display: none;
    }
    .drop-zone.has-image .clear-btn { display: flex; }

    /* message textarea */
    .slot-textarea {
      width: 100%;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1.5px solid var(--blush);
      border-radius: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      color: var(--graphite);
      background: var(--cream);
      resize: vertical;
      min-height: 72px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    .slot-textarea:focus { border-color: var(--rose); }
    .slot-textarea::placeholder { color: var(--blush); font-style: italic; }

    /* ── AUDIO RECORDER ── */
    .audio-recorder {
      margin-top: 10px;
      background: var(--cream);
      border: 1.5px solid var(--blush);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rec-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: 20px;
      padding: 7px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .rec-btn.start {
      background: var(--rose);
      color: white;
    }
    .rec-btn.start:hover { background: var(--deep-rose); }

    .rec-btn.stop {
      background: #c9606f;
      color: white;
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,96,111,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(201,96,111,0); }
    }

    .rec-btn.clear {
      background: none;
      border: 1px solid var(--blush);
      color: var(--soft-graphite);
      font-size: 0.7rem;
    }
    .rec-btn.clear:hover { border-color: var(--rose); color: var(--deep-rose); }

    .rec-timer {
      font-size: 0.75rem;
      color: var(--deep-rose);
      font-weight: 700;
      letter-spacing: 0.05em;
      min-width: 36px;
    }

    .rec-status {
      font-size: 0.72rem;
      color: var(--soft-graphite);
      font-style: italic;
      flex: 1;
    }

    audio.rec-playback {
      height: 32px;
      width: 100%;
      margin-top: 4px;
      border-radius: 8px;
    }

    /* STATUS */
    .status-bar {
      background: var(--warm-white);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 0.83rem;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 12px rgba(200,100,110,0.07);
    }
    .status-bar.show { display: flex; }
    .status-bar.success { border-left: 3px solid var(--success); color: var(--success); }
    .status-bar.error { border-left: 3px solid var(--deep-rose); color: var(--deep-rose); }
    .status-bar.loading { border-left: 3px solid var(--rose); color: var(--soft-graphite); }

    /* SUBMIT */
    .btn-publish {
      width: 100%;
      padding: 16px;
      background: var(--rose);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 8px;
    }
    .btn-publish:hover { background: var(--deep-rose); }
    .btn-publish:active { transform: scale(0.99); }
    .btn-publish:disabled { background: var(--blush); cursor: not-allowed; }

    /* PROGRESS */
    .progress-wrap {
      height: 4px;
      background: var(--blush);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 100%;
      background: var(--rose);
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    /* RECENT */
    .recent-section { margin-top: 40px; }
    .recent-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: var(--graphite);
      margin-bottom: 16px;
    }
    .recent-list { display: flex; flex-direction: column; gap: 10px; }
    .recent-item {
      background: var(--warm-white);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 8px rgba(200,100,110,0.06);
    }
    .recent-thumb {
      width: 44px; height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--cream);
      flex-shrink: 0;
    }
    .recent-info { flex: 1; }
    .recent-date { font-size: 0.85rem; color: var(--graphite); font-weight: 700; }
    .recent-sub { font-size: 0.75rem; color: var(--soft-graphite); margin-top: 2px; }
    .recent-delete {
      background: none;
      border: 1px solid var(--blush);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--soft-graphite);
      cursor: pointer;
      transition: all 0.2s;
    }
    .recent-delete:hover { border-color: var(--rose); color: var(--deep-rose); }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Morning Messages ♡</h1>
    <p>Upload today's four affirmation images for Carolyn.</p>
  </header>

  <!-- Date -->
  <div class="field-group">
    <label>Date</label>
    <input type="date" id="dateInput" />
  </div>

  <!-- Upload slots -->
  <div class="uploads-grid" id="uploadsGrid">
    <!-- rendered by JS -->
  </div>

  <!-- Love note from Jeff -->
  <div class="field-group" style="margin-top: 8px;">
    <label>💛 Love Note from Jeff <span style="font-weight:300; text-transform:none; letter-spacing:0; font-size:0.78rem;">(optional — appears as a handwritten sticky note)</span></label>
    <textarea
      id="love_note"
      placeholder="Write something from the heart… it'll appear as a yellow sticky note at the top of her morning ♡"
      style="width:100%; padding:12px 14px; border:1.5px solid var(--blush); border-radius:10px; font-family:'Lato',sans-serif; font-size:0.92rem; color:var(--graphite); background:var(--cream); resize:vertical; min-height:100px; outline:none; line-height:1.6; transition:border-color 0.2s;"
      onfocus="this.style.borderColor='var(--rose)'"
      onblur="this.style.borderColor='var(--blush)'"
    ></textarea>
    <div class="audio-recorder" id="recorder_audio_love_note" style="margin-top:10px;">
      <button class="rec-btn start" onclick="startRecording('audio_love_note')">🎙 Record your voice note</button>
      <span class="rec-timer" id="timer_audio_love_note" style="display:none">0:00</span>
      <span class="rec-status" id="status_audio_love_note">No voice note</span>
    </div>
  </div>

  <!-- Progress + status -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="status-bar" id="statusBar"></div>

  <!-- Publish button -->
  <button class="btn-publish" id="publishBtn" onclick="publish()">
    Publish Today's Messages ♡
  </button>

  <!-- Recent entries -->
  <div class="recent-section">
    <h2>Recent Days</h2>
    <div class="recent-list" id="recentList">
      <p style="font-size:0.83rem; color:var(--soft-graphite);">Loading…</p>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://istzagkjchlvjsbrvahm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHphZ2tqY2hsdmpzYnJ2YWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTk4MzgsImV4cCI6MjA5NTg3NTgzOH0.7JeL2ScsjC1hoySuKb6q2omgFkGnGoL8dOPDNRNDezk';

  const CLOUDINARY_CLOUD = 'dbv3ahmxu';
  const CLOUDINARY_PRESET = 'carolyn_audio';

  const SLOTS = [
    { key: 'image_1', textKey: 'text_1', audioKey: 'audio_1', placeholder: 'Add a note for this image… (optional)' },
    { key: 'image_2', textKey: 'text_2', audioKey: 'audio_2', placeholder: 'Add a note for this image… (optional)' },
    { key: 'image_3', textKey: 'text_3', audioKey: 'audio_3', placeholder: 'Add a note for this image… (optional)' },
    { key: 'image_4', textKey: 'text_4', audioKey: 'audio_4', placeholder: 'Add a note for this image… (optional)' },
  ];

  const files = { image_1: null, image_2: null, image_3: null, image_4: null };
  const audioBlobs = { audio_1: null, audio_2: null, audio_3: null, audio_4: null, audio_love_note: null };
  const recorders = {};
  const recTimers = {};

  // ── Set today's date ──
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('dateInput').value = today;

  // ── Render upload slots ──
  const grid = document.getElementById('uploadsGrid');
  SLOTS.forEach(slot => {
    grid.innerHTML += `
      <div class="upload-slot">
        <div class="drop-zone" id="zone_${slot.key}">
          <input type="file" accept="image/*" onchange="handleFile('${slot.key}', this)" />
          <div class="clear-btn" onclick="clearFile(event,'${slot.key}')">✕</div>
          <div class="drop-hint">
            <div class="icon">🌸</div>
            <p>Tap to choose<br>or click &amp; paste</p>
          </div>
        </div>
        <textarea
          class="slot-textarea"
          id="text_${slot.key}"
          placeholder="${slot.placeholder}"
        ></textarea>
        <div class="audio-recorder" id="recorder_${slot.audioKey}">
          <button class="rec-btn start" onclick="startRecording('${slot.audioKey}')">🎙 Record</button>
          <span class="rec-timer" id="timer_${slot.audioKey}" style="display:none">0:00</span>
          <span class="rec-status" id="status_${slot.audioKey}">No voice note</span>
        </div>
      </div>`;
  });

  function applyFileToZone(key, file) {
    if (!file || !file.type.startsWith('image/')) return;
    files[key] = file;
    const zone = document.getElementById('zone_' + key);
    zone.classList.add('has-image');
    let img = zone.querySelector('img');
    if (!img) { img = document.createElement('img'); zone.appendChild(img); }
    img.src = URL.createObjectURL(file);
  }

  function handleFile(key, input) {
    applyFileToZone(key, input.files[0]);
  }

  function clearFile(e, key) {
    e.stopPropagation();
    files[key] = null;
    const zone = document.getElementById('zone_' + key);
    zone.classList.remove('has-image');
    const img = zone.querySelector('img');
    if (img) img.remove();
    const input = zone.querySelector('input');
    input.value = '';
  }

  // ── PASTE INTO ZONE ──
  // Track which zone is focused for paste targeting
  let focusedZoneKey = null;

  document.querySelectorAll('.drop-zone').forEach(zone => {
    const key = zone.id.replace('zone_', '');
    zone.setAttribute('tabindex', '0');

    zone.addEventListener('focus', () => { focusedZoneKey = key; });
    zone.addEventListener('click', () => { focusedZoneKey = key; zone.focus(); });
    zone.addEventListener('blur', () => { if (focusedZoneKey === key) focusedZoneKey = null; });
  });

  document.addEventListener('paste', (e) => {
    const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (!file) continue;
        // Use focused zone, or find first empty slot
        const targetKey = focusedZoneKey || SLOTS.find(s => !files[s.key])?.key;
        if (targetKey) applyFileToZone(targetKey, file);
        e.preventDefault();
        break;
      }
    }
  });

  // ── Upload to Supabase Storage ──
  async function uploadImage(file, dateKey, slot) {
    const ext = file.name.split('.').pop();
    const path = `${dateKey}/${slot}.${ext}`;
    const res = await fetch(
      `${SUPABASE_URL}/storage/v1/object/affirmation-images/${path}`,
      {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': file.type,
          'x-upsert': 'true',
        },
        body: file
      }
    );
    if (!res.ok) throw new Error(`Upload failed for ${slot}`);
    return `${SUPABASE_URL}/storage/v1/object/public/affirmation-images/${path}`;
  }

  // ── RECORDING ──
  async function startRecording(audioKey) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      recorders[audioKey] = { mediaRecorder, stream };

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        // Use the actual recorded MIME type for playback compatibility
        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimeType });
        audioBlobs[audioKey] = blob;
        stream.getTracks().forEach(t => t.stop());

        // Show playback using object URL
        const recEl = document.getElementById('recorder_' + audioKey);
        let player = recEl.querySelector('audio');
        if (!player) {
          player = document.createElement('audio');
          player.className = 'rec-playback';
          player.controls = true;
          recEl.appendChild(player);
        }
        const objectUrl = URL.createObjectURL(blob);
        player.src = objectUrl;
        player.load();

        document.getElementById('status_' + audioKey).textContent = 'Voice note ready ✓';
        document.getElementById('timer_' + audioKey).style.display = 'none';

        // Swap buttons
        const startBtn = recEl.querySelector('.rec-btn.stop');
        if (startBtn) {
          startBtn.className = 'rec-btn clear';
          startBtn.textContent = '✕ Clear';
          startBtn.onclick = () => clearRecording(audioKey);
        }
      };

      mediaRecorder.start();

      // Update button to Stop
      const recEl = document.getElementById('recorder_' + audioKey);
      const btn = recEl.querySelector('.rec-btn');
      btn.className = 'rec-btn stop';
      btn.textContent = '⏹ Stop';
      btn.onclick = () => stopRecording(audioKey);

      // Start timer
      let secs = 0;
      const timerEl = document.getElementById('timer_' + audioKey);
      timerEl.style.display = 'inline';
      recTimers[audioKey] = setInterval(() => {
        secs++;
        const m = Math.floor(secs / 60);
        const s = String(secs % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);

    } catch (err) {
      alert('Microphone access denied. Please allow microphone in your browser settings.');
    }
  }

  function stopRecording(audioKey) {
    clearInterval(recTimers[audioKey]);
    if (recorders[audioKey]) {
      recorders[audioKey].mediaRecorder.stop();
    }
  }

  function clearRecording(audioKey) {
    audioBlobs[audioKey] = null;
    const recEl = document.getElementById('recorder_' + audioKey);
    const player = recEl.querySelector('audio');
    if (player) player.remove();
    document.getElementById('status_' + audioKey).textContent = 'No voice note';
    const btn = recEl.querySelector('.rec-btn');
    btn.className = 'rec-btn start';
    btn.textContent = '🎙 Record';
    btn.onclick = () => startRecording(audioKey);
  }

  // ── UPLOAD AUDIO TO CLOUDINARY ──
  async function uploadAudio(blob, dateKey, audioKey) {
    const ext = blob.type.includes('ogg') ? 'ogg' : blob.type.includes('mp4') ? 'mp4' : 'webm';
    const formData = new FormData();
    formData.append('file', blob, `${dateKey}_${audioKey}.${ext}`);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    formData.append('folder', 'carolyn-audio');
    formData.append('resource_type', 'video');

    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/video/upload`,
      { method: 'POST', body: formData }
    );
    if (!res.ok) throw new Error(`Audio upload failed for ${audioKey}`);
    const data = await res.json();
    return data.secure_url;
  }

  // ── Publish ──
  async function publish() {
    const dateKey = document.getElementById('dateInput').value;
    if (!dateKey) return showStatus('Please choose a date.', 'error');

    const hasAny = Object.values(files).some(f => f !== null);
    if (!hasAny) return showStatus('Please add at least one image.', 'error');

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    showStatus('Uploading images…', 'loading');
    showProgress(10);

    try {
      const urls = {};
      const imageKeys = Object.keys(files);
      for (let i = 0; i < imageKeys.length; i++) {
        const key = imageKeys[i];
        if (files[key]) urls[key] = await uploadImage(files[key], dateKey, key);
        showProgress(10 + (i + 1) * 12);
      }

      // Upload audio clips to Cloudinary
      showStatus('Uploading voice notes…', 'loading');
      const audioKeys = Object.keys(audioBlobs);
      for (let i = 0; i < audioKeys.length; i++) {
        const key = audioKeys[i];
        if (audioBlobs[key]) {
          urls[key] = await uploadAudio(audioBlobs[key], dateKey, key);
        }
        showProgress(60 + (i + 1) * 7);
      }

      showProgress(90);
      showStatus('Saving…', 'loading');

      const res = await fetch(`${SUPABASE_URL}/rest/v1/affirmations`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({
          date: dateKey,
          ...urls,
          text_1: document.getElementById('text_image_1')?.value.trim() || null,
          text_2: document.getElementById('text_image_2')?.value.trim() || null,
          text_3: document.getElementById('text_image_3')?.value.trim() || null,
          text_4: document.getElementById('text_image_4')?.value.trim() || null,
          love_note: document.getElementById('love_note')?.value.trim() || null,
          audio_love_note: urls['audio_love_note'] || null,
        })
      });

      if (!res.ok) throw new Error('Database save failed');

      showProgress(100);
      showStatus("✓ Published! Carolyn's morning is ready ♡", 'success');
      loadRecent();
    } catch (err) {
      showStatus('Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      setTimeout(() => hideProgress(), 1200);
    }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar show ' + type;
  }

  function showProgress(pct) {
    document.getElementById('progressWrap').classList.add('show');
    document.getElementById('progressBar').style.width = pct + '%';
  }
  function hideProgress() {
    document.getElementById('progressWrap').classList.remove('show');
    document.getElementById('progressBar').style.width = '0%';
  }

  // ── Load recent ──
  async function loadRecent() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/affirmations?select=date,image_1&order=date.desc&limit=10`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    const list = document.getElementById('recentList');

    if (!rows.length) {
      list.innerHTML = `<p style="font-size:0.83rem; color:var(--soft-graphite);">No entries yet.</p>`;
      return;
    }

    list.innerHTML = rows.map(r => `
      <div class="recent-item">
        ${r.image_1 ? `<img class="recent-thumb" src="${r.image_1}" />` : '<div class="recent-thumb"></div>'}
        <div class="recent-info">
          <div class="recent-date">${r.date}</div>
          <div class="recent-sub">4 images published</div>
        </div>
        <button class="recent-delete" onclick="deleteEntry('${r.date}')">Remove</button>
      </div>
    `).join('');
  }

  async function deleteEntry(dateKey) {
    if (!confirm(`Remove ${dateKey}?`)) return;
    await fetch(`${SUPABASE_URL}/rest/v1/affirmations?date=eq.${dateKey}`, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    loadRecent();
  }

  loadRecent();
</script>
</body>
</html>
