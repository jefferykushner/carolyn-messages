[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Protect admin page with Netlify password
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  node_bundler = "esbuild"
